<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Logo VIGÉA">
  <title>VIGÉA — Prendre soin de ceux qui soignent</title>
  <defs>
    <style>
      .wm { font-family: 'Nunito', 'Nunito Sans', system-ui, sans-serif; font-weight: 900; letter-spacing: -1.5px; }
      .tag { font-family: 'Nunito', 'Nunito Sans', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.5px; }
    </style>
  </defs>
  <!-- Symbol: protective V-arc opening downward, adherent dot at base -->
  <g transform="translate(14,18)">
    <!-- Outer arc (embrace) -->
    <path d="M 8 96 Q 56 -14 104 96"
          fill="none" stroke="#14379E" stroke-width="14" stroke-linecap="round"/>
    <!-- Inner shorter arc (double embrace, mutualist layered protection) -->
    <path d="M 32 96 Q 56 40 80 96"
          fill="none" stroke="#2354EA" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <!-- Adherent dot (rose) -->
    <circle cx="56" cy="92" r="9" fill="#BE397A"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(146,0)">
    <!-- Custom rose accent above the É -->
    <path d="M 154 28 L 176 14" stroke="#BE397A" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="88" class="wm" font-size="72" fill="#14379E">VIGEA</text>
    <!-- Tagline -->
    <text x="2" y="118" class="tag" font-size="15" fill="#383C4C">Prendre soin de ceux qui soignent.</text>
  </g>
</svg>
