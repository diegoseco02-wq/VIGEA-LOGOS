<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 140" role="img" aria-label="VIGÉA PREVOYANCE — logo d'endossement UMG">
  <title>VIGÉA PREVOYANCE</title>
  <defs>
    <style>
      .wm { font-family: 'Nunito', 'Nunito Sans', system-ui, sans-serif; font-weight: 900; letter-spacing: -1.5px; }
      .tag { font-family: 'Nunito', 'Nunito Sans', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.5px; }
      .ent { font-family: 'Nunito', 'Nunito Sans', system-ui, sans-serif; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- Symbol -->
  <g transform="translate(14,18)">
    <path d="M 8 96 Q 56 -14 104 96" fill="none" stroke="#14379E" stroke-width="14" stroke-linecap="round"/>
    <path d="M 32 96 Q 56 40 80 96" fill="none" stroke="#2354EA" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="56" cy="92" r="9" fill="#BE397A"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(146,0)">
    <path d="M 154 28 L 176 14" stroke="#BE397A" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="88" class="wm" font-size="72" fill="#14379E">VIGEA</text>
    <text x="2" y="118" class="tag" font-size="15" fill="#383C4C">Prendre soin de ceux qui soignent.</text>
  </g>
  <!-- Divider -->
  <line x1="440" y1="40" x2="440" y2="100" stroke="#CDCED2" stroke-width="1.5"/>
  <!-- Entity label -->
  <text x="460" y="76" class="ent" font-size="26" fill="#14379E">PRÉVOYANCE</text>
  <text x="460" y="98" class="tag" font-size="13" fill="#6A6D78">Union Mutualiste de Groupe</text>
</svg>
